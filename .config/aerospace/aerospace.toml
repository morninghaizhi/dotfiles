# AeroSpace config
# Reference: https://nikitabobko.github.io/AeroSpace/guide
# Default config: https://nikitabobko.github.io/AeroSpace/guide#default-config

config-version = 2

# Start AeroSpace at login
start-at-login = true

after-startup-command = ['exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0']

# Notify SketchyBar to update workspace indicators
# See: https://nikitabobko.github.io/AeroSpace/goodies#show-aerospace-workspaces-in-sketchybar
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Hide macOS "Displays have separate Spaces" side effects when apps are hidden (cmd-h)
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*)
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 44 # SketchyBar height (shown on all monitors)
outer.right      = 8

# 'main' binding mode
[mode.main.binding]
# alt-enter is left free for apps (e.g. Android Studio quick fix)
# Ghostty is opened via a Raycast hotkey

# Open a new WezTerm window (reuses the running GUI instead of launching another app instance)
alt-shift-enter = ['workspace W', 'exec-and-forget /opt/homebrew/bin/wezterm cli --no-auto-start spawn --new-window || open -a WezTerm']

# Layouts
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize ('=' is hard to reach on roBa, so use shift-minus to grow)
alt-minus = 'resize smart -50'
alt-shift-minus = 'resize smart +50'

# Workspaces
# Letters are limited to app workspaces (see on-window-detected below).
# b/d/f are kept free for zsh word movement (alt-b/alt-f/alt-d).
# Keep in sync with `workspaces` in ~/.config/sketchybar/items/spaces.lua
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-e = 'workspace E'
alt-g = 'workspace G'
alt-m = 'workspace M'
alt-s = 'workspace S'
alt-t = 'workspace T'
alt-w = 'workspace W'
alt-z = 'workspace Z'

# roBa's NUM layer sends keypad keycodes
alt-keypad1 = 'workspace 1'
alt-keypad2 = 'workspace 2'
alt-keypad3 = 'workspace 3'
alt-keypad4 = 'workspace 4'
alt-keypad5 = 'workspace 5'
alt-keypad6 = 'workspace 6'
alt-keypad7 = 'workspace 7'
alt-keypad8 = 'workspace 8'
alt-keypad9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-g = 'move-node-to-workspace G'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-z = 'move-node-to-workspace Z'

alt-shift-keypad1 = 'move-node-to-workspace 1'
alt-shift-keypad2 = 'move-node-to-workspace 2'
alt-shift-keypad3 = 'move-node-to-workspace 3'
alt-shift-keypad4 = 'move-node-to-workspace 4'
alt-shift-keypad5 = 'move-node-to-workspace 5'
alt-shift-keypad6 = 'move-node-to-workspace 6'
alt-shift-keypad7 = 'move-node-to-workspace 7'
alt-shift-keypad8 = 'move-node-to-workspace 8'
alt-shift-keypad9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Monitors
cmd-ctrl-h = 'focus-monitor left'
cmd-ctrl-j = 'focus-monitor down'
cmd-ctrl-k = 'focus-monitor up'
cmd-ctrl-l = 'focus-monitor right'

# Move the whole workspace (not a single window) so its key stays the same
cmd-ctrl-shift-h = 'move-workspace-to-monitor left'
cmd-ctrl-shift-j = 'move-workspace-to-monitor down'
cmd-ctrl-shift-k = 'move-workspace-to-monitor up'
cmd-ctrl-shift-l = 'move-workspace-to-monitor right'

alt-shift-semicolon = 'mode service'

# Enter 'move' mode, then press the target workspace key
# (easier than alt-shift-<n> on roBa)
alt-period = 'mode move'

# 'service' binding mode (enter with alt-shift-;)
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating/tiling
b = ['balance-sizes', 'mode main'] # balance window sizes

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# 'move' binding mode (enter with alt-.)
# Send the focused window to a workspace, then return to main mode
[mode.move.binding]
esc = 'mode main'
1 = ['move-node-to-workspace 1', 'mode main']
2 = ['move-node-to-workspace 2', 'mode main']
3 = ['move-node-to-workspace 3', 'mode main']
4 = ['move-node-to-workspace 4', 'mode main']
5 = ['move-node-to-workspace 5', 'mode main']
6 = ['move-node-to-workspace 6', 'mode main']
7 = ['move-node-to-workspace 7', 'mode main']
8 = ['move-node-to-workspace 8', 'mode main']
9 = ['move-node-to-workspace 9', 'mode main']
keypad1 = ['move-node-to-workspace 1', 'mode main']
keypad2 = ['move-node-to-workspace 2', 'mode main']
keypad3 = ['move-node-to-workspace 3', 'mode main']
keypad4 = ['move-node-to-workspace 4', 'mode main']
keypad5 = ['move-node-to-workspace 5', 'mode main']
keypad6 = ['move-node-to-workspace 6', 'mode main']
keypad7 = ['move-node-to-workspace 7', 'mode main']
keypad8 = ['move-node-to-workspace 8', 'mode main']
keypad9 = ['move-node-to-workspace 9', 'mode main']
e = ['move-node-to-workspace E', 'mode main']
g = ['move-node-to-workspace G', 'mode main']
m = ['move-node-to-workspace M', 'mode main']
s = ['move-node-to-workspace S', 'mode main']
t = ['move-node-to-workspace T', 'mode main']
w = ['move-node-to-workspace W', 'mode main']
z = ['move-node-to-workspace Z', 'mode main']

# Float apps that don't tile well
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# Assign apps to workspaces
[[on-window-detected]] # Arc
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]] # Android Studio
if.app-id = 'com.google.android.studio'
run = 'move-node-to-workspace 3'

[[on-window-detected]] # VS Code
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 4'

[[on-window-detected]] # Mail
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace E'

[[on-window-detected]] # Sourcetree
if.app-id = 'com.torusknot.SourceTreeNotMAS'
run = 'move-node-to-workspace 5'

[[on-window-detected]] # Ghostty
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace G'

[[on-window-detected]] # Spotify
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace M'

[[on-window-detected]] # Slack
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]] # Teams
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace T'

[[on-window-detected]] # WezTerm
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace W'

[[on-window-detected]] # Zoom
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace Z'
